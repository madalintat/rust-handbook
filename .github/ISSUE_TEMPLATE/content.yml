name: Something in the content is wrong
description: A unit, exercise, drill, project or glossary term that is incorrect or misleading.
title: "[content] "
labels:
  - content
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The unit, project or exercise, and the section if you can name it.
      placeholder: 05-ownership, exercise 4, the E0382 explanation
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: What it says now, and what it should say instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What the compiler said
      description: >
        If this is about an exercise or a diagnostic, paste the code you ran and
        rustc's actual output. The compiler settles most of these.
      render: text
    validations:
      required: false
