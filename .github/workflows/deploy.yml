name: Deploy

# The site is static and needs no build step at deploy time, so this publishes
# the repository as it stands. Enable Pages in Settings first, or point the
# custom domain at it once there is one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # data/ is committed, but rebuilding here means a deploy can never ship
      # JSON that disagrees with the markdown beside it.
      - name: Build
        run: python3 build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
