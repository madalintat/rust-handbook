name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going cancels it: the older
# result is about code nobody will ship.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No lockfile and no install step: the project has no dependencies, and
      # this job failing on a missing one would be the signal that changed.
      - name: Assert there are no dependencies
        run: |
          test ! -f package.json || (echo "package.json appeared" && exit 1)
          test ! -f requirements.txt || (echo "requirements.txt appeared" && exit 1)

      # Build, data/ freshness, the prose rule, and all three offline suites.
      # release.sh owns the sequence so that CI and a release cannot disagree
      # about what "verified" means.
      - name: Verify
        run: ./release.sh --check

  compiler:
    name: Exercises compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Every exercise is compiled on play.rust-lang.org, so this job depends on a
    # third party being up. It runs on main and on demand, not on every push to
    # a branch, to keep the load on a free service proportionate.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate every exercise and stage against real rustc
        run: python3 build.py --validate

      - name: Report the toolchain that validated them
        run: |
          python3 - <<'PY'
          import json
          a = json.load(open('data/manifest.json'))['audit']
          tc = a.get('toolchain') or {}
          print(f"rustc {tc.get('version','?')} ({tc.get('date','?')})")
          print(f"checked {a['checked']}, cached {a['cached']}, findings {len(a['findings'])}")
          PY

  live:
    name: Workbench against the live compiler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_workbench.mjs

  deploy:
    name: Publish to Pages
    # The site is static, so this publishes the tree as committed. It waits on
    # the build job: as a workflow of its own it had no ordering against CI at
    # all, and could put a failing commit on the domain before a single test
    # had run.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # A Pages deploy already in flight is left to finish; queue behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: ./release.sh --site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
