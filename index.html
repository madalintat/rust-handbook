<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust Handbook</title>
<meta name="description" content="Learn Rust by fighting the compiler. Every exercise compiles for real, and every error comes with a plain-language reading of what the borrow checker actually saw.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" type="image/png" href="assets/ferris.png">
<link rel="apple-touch-icon" href="assets/ferris.png">
<meta property="og:title" content="Rust Handbook">
<meta property="og:description" content="Learn Rust by fighting the compiler.">
<meta property="og:image" content="assets/ferris.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#efebe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<script>
  /* Theme is resolved before first paint so the page never flashes the wrong
     ground. Light is the default: a reader who has never chosen gets the book. */
  try { document.documentElement.dataset.theme = localStorage.getItem('rh-theme') || 'light'; }
  catch (e) {}
</script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">
    <img class="mascot" src="assets/ferris.png" alt="" width="30" height="20">
    Rust Handbook
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>
  <label class="searchbox">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search the track…" autocomplete="off" spellcheck="false">
  </label>
  <button class="iconbtn" id="theme" title="Light / dark" aria-label="Toggle theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main id="app"><div class="loading">loading…</div></main>

<!-- Mobile: a thumb-reachable tab bar instead of a nav row nobody can hit, and a
     contents sheet that slides up from the bottom the way an iOS sheet does. -->
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Contents">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><span class="eyebrow">In this unit</span>
    <button class="iconbtn" id="sheetclose" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetbody"></div>
</div>

<footer class="site">
  <div class="wrap">
    <img class="rustmark" src="assets/rust-logo.svg" alt="" width="15" height="15">
    <span>Rust Handbook</span>
    <span>·</span>
    <span id="footstats"></span>
    <span class="spacer" style="flex:1"></span>
    <span>Compiled for real by <a href="https://play.rust-lang.org" target="_blank" rel="noopener">play.rust-lang.org</a>.</span>
  </div>
</footer>

<script src="assets/gate.js"></script>
<script src="assets/companion.js"></script>
<script src="assets/workbench.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
