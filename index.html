<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust Handbook</title>
<meta name="description" content="Learn Rust by fighting the compiler. Every exercise compiles for real, and every error comes with a plain-language reading of what the borrow checker actually saw.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" type="image/png" href="assets/ferris.png">
<link rel="apple-touch-icon" href="assets/ferris.png">
<meta property="og:title" content="Rust Handbook">
<meta property="og:description" content="Learn Rust by fighting the compiler.">
<meta property="og:image" content="assets/ferris.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#efebe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<script>
  /* Theme is resolved before first paint so the page never flashes the wrong
     ground. Light is the default: a reader who has never chosen gets the book. */
  try { document.documentElement.dataset.theme = localStorage.getItem('rh-theme') || 'light'; }
  catch (e) {}
</script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">
    <img class="mascot" src="assets/ferris.png" alt="" width="30" height="20">
    Rust Handbook
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>

  <!-- Stacked marks for the assistants people actually paste this into, and one
       click copies llms.txt: the whole project described in a form an assistant
       can read in one go. -->
  <button class="llms" id="llms" title="Copy this project for an LLM">
    <span class="stack" aria-hidden="true">
      <span class="av a1"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 2.6 14.4 9h6.7l-5.4 4 2 6.4-5.7-4-5.7 4 2-6.4-5.4-4h6.7z"/></svg></span>
      <span class="av a2"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 4v5M16 4v5M6 11h12a2 2 0 0 1 2 2v4a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-4a2 2 0 0 1 2-2z"/></svg></span>
      <span class="av a3"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V7l8-4 8 4v10l-8 4z"/></svg></span>
    </span>
    <span class="lbl">for LLMs</span>
  </button>

  <a class="ghlink" id="gh" href="https://github.com/madalintat/rust-handbook"
     target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub">
    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>

  <label class="searchbox">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search the track…" autocomplete="off" spellcheck="false">
  </label>
  <button class="iconbtn" id="theme" title="Light / dark" aria-label="Toggle theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main id="app"><div class="loading">loading…</div></main>

<!-- Mobile: a thumb-reachable tab bar instead of a nav row nobody can hit, and a
     contents sheet that slides up from the bottom the way an iOS sheet does. -->
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Contents">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><span class="eyebrow">In this unit</span>
    <button class="iconbtn" id="sheetclose" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetbody"></div>
</div>

<footer class="site">
  <div class="wrap">
    <img class="rustmark" src="assets/rust-logo.svg" alt="" width="15" height="15">
    <span>Rust Handbook</span>
    <span>·</span>
    <span id="footstats"></span>
    <span>·</span>
    <span id="toolchain"></span>
    <span class="spacer"></span>
    <span>Compiled for real by <a href="https://play.rust-lang.org" target="_blank" rel="noopener">play.rust-lang.org</a>.</span>
  </div>
</footer>

<script src="assets/companion.js"></script>
<script src="assets/vim.js"></script>
<script src="assets/workbench.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
